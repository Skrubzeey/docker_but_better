name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: skrubzeey/diabetes-pipeline:latest

    env:
      DATA_PATH: ${{ github.workspace }}/data
      MODEL_DIR: ${{ github.workspace }}/models
      TEST_SIZE: 0.2
      RANDOM_SEED: 42

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use API secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Sekret API_KEY zostal poprawnie przekazany."
          else
            echo "Brak sekretu API_KEY."
            exit 1
          fi

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Train model
        run: |
          mkdir -p models
          python train.py

      - name: Evaluate model
        run: python evaluate.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/pipeline.pkl
          if-no-files-found: error
